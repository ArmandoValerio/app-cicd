{{- $ingress := .Values.ingress | default dict -}}
{{- $service := .Values.service | default dict -}}
{{- $envName := .Values.environment | default "prod" -}}
{{- if ($ingress.enabled | default false) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    environment: {{ $envName | quote }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $ingress.className }}
  ingressClassName: {{ $ingress.className }}
  {{- end }}
  {{- if and $ingress.tls $ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $ingress.host }}
      secretName: {{ $ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $ingress.host }}
      http:
        paths:
          - path: {{ $ingress.path | default "/" }}
            pathType: {{ $ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: {{ $service.port | default 80 }}
{{- end }}
